[project]
name = "pyannote-diarization"
version = "0.1.0"
description = "Audio diarization using PyAnnote"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5.0",
    "torchaudio>=2.5.0",
    "huggingface-hub>=0.28.1",
    "pyannote.audio==4.0.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[tool.uv]
# Keep this version bound. torchcodec resolves from PyPI, not the cu126 pytorch
# index used for torch below, so an unbounded override silently picks up a build
# compiled against a newer CUDA than torch: 0.15.0 links libnvrtc.so.13, which is
# absent alongside cu126 torch and only fails at diarization runtime. 0.7.x is the
# line verified against torch 2.8.0+cu126 (it is also what the WhisperX env pins).
override-dependencies = [
    "torchcodec~=0.7.0 ; sys_platform != 'linux' or platform_machine != 'aarch64'"
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cpu", marker = "platform_machine != 'x86_64' and sys_platform != 'darwin'" },
    { index = "pytorch", marker = "platform_machine == 'x86_64' and sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cpu", marker = "platform_machine != 'x86_64' and sys_platform != 'darwin'" },
    { index = "pytorch", marker = "platform_machine == 'x86_64' and sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
