# A1-Events fork: build + push the CUDA image to GHCR.
# Runs on a1/* branches and a1-v* tags only, so upstream-sync branches don't
# trigger builds. The deployed PC pulls ghcr.io/a1-events/scriberr-cuda:<ref>
# anonymously (public image).
name: Build CUDA image

on:
  push:
    branches: ["a1/**"]
    tags: ["a1-v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-cuda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Free disk space (CUDA image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: meta
        run: |
          REF="${GITHUB_REF_NAME//\//-}"
          echo "tag=ghcr.io/a1-events/scriberr-cuda:${REF}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=ghcr.io/a1-events/scriberr-cuda:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cuda
          push: true
          tags: |
            ${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
